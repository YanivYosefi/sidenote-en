<!doctype html>

<meta charset="utf-8">
<title>Sidenote reel</title>
<!--
  One vertical reel, drawn as a pure function of time.

  make.py calls setup(job) once, then render(t) for every frame and takes a
  screenshot. Nothing here runs on a clock of its own, so the same job always
  renders the same frames: no dropped frames, no timing drift, and a slow
  machine produces the same video as a fast one, only later.

  1080x1920. Instagram and TikTok cover roughly the top 220px and the bottom
  420px with their own UI, and a column of buttons down the right; everything
  that has to be read sits inside the safe box below.
-->

</head>
<body>
<div class="stage" id="stage"></div>
<script>
/* ---------- time helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const outC = x => 1 - Math.pow(1 - x, 3);
const inOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
/* in over [a,a+d], hold, out over [b-d,b]; returns 0..1 */
const win = (t, a, b, d = .4) => Math.min(outC(prog(t, a, a + d)), 1 - inOut(prog(t, b - d, b)));
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* Hebrew with English inside it: isolate each English run so right-to-left
   layout cannot reorder it, and give each ';'-separated clause its own line. */
const heb = s => esc(s).replace(/[A-Za-z][A-Za-z'.\- ]*[A-Za-z.]|[A-Za-z]/g, m => `<bdi dir="ltr">${m}</bdi>`).replace(/;\s*/g, '<br>');
function show(el, v, dy = 40) {
  el.style.opacity = v;
  /* cards are centred on their top edge, so they keep that offset while moving */
  el.style.transform = `translateY(calc(${el.classList.contains('card') ? '-50%' : '0px'} + ${(1 - v) * dy}px))`;
  el.style.visibility = v <= 0.001 ? 'hidden' : 'visible';
}
/* Put an element a gap below another, by measured height, not a guess:
   a heading that wraps to two lines in English must push the rest down. */
function below(el, ref, gap) {
  const r = ref.getBoundingClientRect();
  el.style.top = Math.round(r.bottom + gap) + 'px';
}
/* Shrink a box's text until it fits. Done once in setup, never per frame. */
function fit(el, max, min) {
  let s = max;
  el.style.fontSize = s + 'px';
  while (s > min && (el.scrollHeight > el.clientHeight + 2 || el.scrollWidth > el.clientWidth + 2)) {
    s -= 2; el.style.fontSize = s + 'px';
  }
  return s;
}

/* The expression inside its example sentence. Tries the exact words first,
   then each word's stem, so "to gloss over" still finds "glossed over". */
function markIn(sentence, expr) {
  const parts = expr.split(/\s+vs\.?\s+/i);
  let html = esc(sentence), hit = false;
  for (const p of parts) {
    const words = p.replace(/^(to|the|a)\s+/i, '').split(/\s+/).filter(Boolean);
    if (!words.length) continue;
    /* whole words: "imply" should light up all of "implying", not most of it */
    const exact = new RegExp('\\b' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('\\W+') + "[\\w']*", 'i');
    const stems = new RegExp(words.map(w => {
      const k = w.replace(/[^a-z']/gi, '');
      return (k.length > 4 ? k.slice(0, k.length - 2) : k).replace(/'/g, "'?") + "[\\w']*";
    }).join("\\W+(?:\\w+\\W+)?"), 'i');
    for (const re of [exact, stems]) {
      const m = html.match(re);
      if (m) { html = html.replace(m[0], `<mark>${m[0]}</mark>`); hit = true; break; }
    }
  }
  return { html, hit };
}

const HOOKS = {
  'ביטוי': 'ביטוי באנגלית<br>שכדאי להכיר',
  'הבחנה עדינה': 'גם דוברי אנגלית<br>מתבלבלים פה',
  'סלנג מקצועי': 'תשמעו את זה<br>בכל חברת הייטק',
  'פועל מורכב': 'פועל אחד,<br>משמעות שלא תנחשו',
  'צירוף מקצועי': 'תשמעו את זה<br>בכל ישיבה באנגלית',
};

const UI = {
  he: { english: 'אנגלית', quiz: 'חידון', whatMeans: 'מה זה אומר?', example: 'דוגמה',
        k1: 'אתם ממילא פה<br>שעות כל יום', k2: 'אז בסוף כל תשובה,<br>ביטוי אחד מתוכה',
        l1: 'ביטוי אחד בכל שיחה עם Claude', l2: 'מתוך התשובה שקיבלת.<br>בלי אפליקציה, בלי כרטיסיות.',
        chips: ['חינם', 'קוד פתוח', 'בלי חשבון'], cta: 'הקישור בפרופיל',
        literally: 'מילולית', actually: 'בפועל', vsHook: 'גם דוברי אנגלית<br>מתבלבלים ביניהן' },
  en: { english: 'English', quiz: 'Quiz', whatMeans: 'What does it mean?', example: 'Example',
        k1: "You're in Claude<br>for hours anyway", k2: 'So after every answer,<br>one expression from it',
        l1: 'One expression in every Claude chat', l2: 'Taken from the answer you got.<br>No app. No flashcards.',
        chips: ['Free', 'Open source', 'No account'], cta: 'Link in bio',
        literally: 'Literally', actually: 'Actually', vsHook: 'Even native speakers<br>mix these up' },
};
let U = UI.he;
const outro = () => `<div class="out" id="out"><div class="in">
  <div class="logo ltr">Side<b>note</b></div>
  <div class="l1">${U.l1}</div>
  <div class="l2">${U.l2}</div>
  <div class="chips">${U.chips.map(c => `<span>${c}</span>`).join('')}</div>
  <div class="cta">${U.cta}</div>
</div></div>`;


let R = null;   /* the active renderer */

/* ---------- reel 1: one expression ---------- */
function setupExpr(j) {
  const m = markIn(j.example, j.expr);
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="tag" id="tag"><b>${U.english}</b><span>${esc(j.kind)}</span></div>
    <div class="hook" id="hook">${HOOKS[j.kind] || 'ביטוי באנגלית<br>שכדאי להכיר'}</div>
    <div class="ex" id="ex"><div class="w ltr" id="w">${esc(j.expr)}</div><div class="u" id="u"></div></div>
    <div class="card" id="c1"><div class="lb">מה זה אומר</div><div class="tx" id="t1">${heb(j.meaning)}</div></div>
    <div class="card" id="c2"><div class="lb">דוגמה</div><div class="tx en ltr" id="t2">${m.html}</div></div>
    <div class="card" id="c3"><div class="lb">מתי משתמשים</div><div class="tx" id="t3">${heb(j.when)}</div></div>
    ${outro()}`;
  /* Big and on at most two lines. Fitting to one line made a long phrase
     like "the elephant in the room" tiny. */
  const w = $('#w'); let s = 150;
  w.style.fontSize = s + 'px';
  while (s > 64 && w.getBoundingClientRect().height > s * 1.1 * 2 + 4) { s -= 4; w.style.fontSize = s + 'px'; }
  fit($('#t1'), 80, 40); fit($('#t2'), 70, 36); fit($('#t3'), 64, 34);
  const plain = $('#t2').textContent;
  const T = 15;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#tag'), win(t, 0, 12.8, .5), 20);
    show($('#hook'), win(t, .2, 3.0, .6), 50);
    /* the expression wipes in, underlines, then rises to make room */
    const r = outC(prog(t, 1.1, 2.1));
    w.style.clipPath = `inset(0 ${100 - r * 100}% 0 0)`;
    $('#u').style.width = `${outC(prog(t, 2.0, 2.6)) * 60}%`;
    const up = inOut(prog(t, 2.8, 3.5));
    const ex = $('#ex');
    ex.style.top = `${880 - up * (880 - 420)}px`;
    ex.style.transform = `scale(${1 - up * .22})`;
    ex.style.opacity = 1 - prog(t, 12.4, 12.8);
    show($('#c1'), win(t, 3.4, 6.6), 60);
    show($('#c2'), win(t, 6.6, 10.4), 60);
    /* type the example, then run the highlighter over the expression */
    const tp = prog(t, 6.8, 7.5), t2 = $('#t2');
    if (tp < 1) { t2.textContent = plain.slice(0, Math.round(plain.length * tp)); t2.dataset.full = ''; }
    else if (!t2.dataset.full) { t2.innerHTML = m.html; t2.dataset.full = '1'; }
    t2.querySelectorAll('mark').forEach((mk, i) => {
      mk.style.backgroundSize = `${outC(prog(t, 7.7 + i * .35, 8.3 + i * .35)) * 100}% 100%`;
    });
    show($('#c3'), win(t, 10.4, 12.8), 60);
    const o = outC(prog(t, 12.7, 13.4));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 13.1, 13.7));
  };
}

/* ---------- reel 2: the product, one real walk-through ---------- */
function setupDemo(j) {
  const tmp = document.createElement('div'); tmp.innerHTML = j.note;
  const expr = (tmp.querySelector('.expr') || {}).textContent || '';
  const gloss = (tmp.querySelector('.gloss') || {}).textContent || '';
  const rtlExpr = tmp.querySelector('.expr.rtl');
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="cap" id="k1">${U.k1}</div>
    <div class="cap" id="k2">${U.k2}</div>
    <div class="win" id="win">
      <div class="top"><s>✳</s><span class="ltr">Claude Code</span><em dir="ltr">${esc(j.pair)}</em></div>
      <div class="body">
        <p class="q" id="q"><span id="qt"></span><i class="car" id="car"></i></p>
        <div class="a" id="a"></div>
        <div class="note" id="n"><div class="nt ltr">SIDENOTE</div>
          ${(() => {
            /* "اِنْسى الموضوع · insa el-mawdouʿ": the script on one line, its
               transliteration under it, so the two directions never interleave */
            const [main, tr] = expr.split(/\s+·\s+/);
            return `<div class="nx ${rtlExpr ? '' : 'ltr'}" dir="${rtlExpr ? 'rtl' : 'ltr'}">${esc(main)}</div>` +
                   (tr ? `<div class="tr ltr" dir="ltr">${esc(tr)}</div>` : '');
          })()}
          <div class="ng">${esc(gloss)}</div></div>
      </div>
    </div>
    ${outro()}`;
  const T = 13;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#k1'), win(t, 0, 2.9, .4), 30);
    show($('#k2'), win(t, 3.0, 9.6, .4), 30);
    show($('#win'), outC(prog(t, .2, .8)) * (1 - prog(t, 9.4, 9.8)), 80);
    /* typed fast on purpose: nobody watches a reel for the typing */
    const qp = prog(t, .7, 1.4);
    $('#qt').textContent = j.q.slice(0, Math.round(j.q.length * qp));
    $('#car').style.opacity = t < 1.7 ? 1 : 0;
    const ap = prog(t, 1.6, 2.6);
    $('#a').textContent = ap > 0 ? '✳  ' + j.a.slice(0, Math.round(j.a.length * ap)) : '';
    /* the part worth the time: the block arrives, the expression pops, then its meaning */
    const n = outC(prog(t, 2.8, 3.4));
    show($('#n'), n, 60);
    const pop = Math.sin(Math.PI * prog(t, 3.4, 3.9));
    $('#n .nx').style.transform = `scale(${1 + .08 * pop})`;
    $('#n .nx').style.transformOrigin = 'right center';
    $('#n .ng').style.opacity = outC(prog(t, 4.0, 4.5));
    const tr = $('#n .tr'); if (tr) tr.style.opacity = outC(prog(t, 3.6, 4.0));
    const o = outC(prog(t, 9.7, 10.4));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 10.1, 10.7));
  };
}


/* ---------- reel 3: a quiz. make.py picks the wrong answers and where the
   right one sits, so the same job is always the same quiz. ---------- */
function setupQuiz(j) {
  const L = U === UI.en ? ['A', 'B', 'C'] : ['א', 'ב', 'ג'];
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="tag" id="tag"><b>${U.quiz}</b><span>${esc(j.cat)}</span></div>
    <div class="qhook" id="qh">${U.whatMeans}</div>
    <div class="qx"><div class="w ltr" id="w">${esc(j.expr)}</div></div>
    <div class="ring" id="ring"><span id="rn">3</span></div>
    ${j.options.map((o, i) => `<div class="opt" id="o${i}" style="top:${1000 + i * 190}px"><span class="l">${L[i]}</span><span class="t" id="ot${i}">${heb(o)}</span></div>`).join('')}
    <div class="qex" id="qe"><div class="lb">${U.example}</div><div class="tx ltr" id="qet">${markIn(j.example, j.expr).html}</div></div>
    ${outro()}`;
  const w = $('#w'); let s = 120; w.style.fontSize = s + 'px';
  while (s > 64 && w.getBoundingClientRect().height > s * 1.1 * 2 + 4) { s -= 4; w.style.fontSize = s + 'px'; }
  below($('.qx'), $('#qh'), 40);
  /* the ring and the answers go under the expression, however many lines it took */
  below($('#ring'), $('.qx'), 36);
  const rb = $('#ring').getBoundingClientRect().bottom;
  const base = Math.max(1000, Math.round(rb + 40));
  j.options.forEach((_, i) => { $('#o' + i).style.top = (base + i * 190) + 'px'; });
  $('#qe').style.top = (base + 190 + 110) + 'px';
  j.options.forEach((_, i) => fit($('#ot' + i), 48, 30));
  fit($('#qet'), 52, 32);
  const T = 12.4;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#tag'), win(t, 0, 9.6, .5), 20);
    show($('#qh'), win(t, .1, 9.6, .5), 30);
    w.style.clipPath = `inset(0 ${100 - outC(prog(t, .7, 1.6)) * 100}% 0 0)`;
    $('#w').parentElement.style.opacity = 1 - prog(t, 9.3, 9.6);
    /* countdown: three seconds, a ring filling around the number */
    const c = prog(t, 3.0, 6.0);
    show($('#ring'), win(t, 2.7, 6.4, .3), 10);
    $('#ring').style.setProperty('--p', `${c * 100}%`);
    $('#rn').textContent = t < 6 ? String(3 - Math.min(2, Math.floor(c * 3))) : '✓';
    j.options.forEach((_, i) => {
      const o = $('#o' + i), good = i === j.answer;
      const inV = outC(prog(t, 1.7 + i * .25, 2.2 + i * .25));
      const rev = t >= 6.0;
      o.classList.toggle('good', rev && good);
      let op = inV, dy = (1 - inV) * 60;
      if (rev && !good) op = inV * (1 - .65 * outC(prog(t, 6.0, 6.3))) * (1 - prog(t, 7.0, 7.4));
      if (good) { dy -= (i * 190 + (base - 1000) * 0 + 90) * inOut(prog(t, 7.0, 7.6)); op *= 1 - prog(t, 9.3, 9.6); }
      o.style.opacity = op; o.style.transform = `translateY(${dy}px) scale(${rev && good ? 1 + .04 * Math.sin(Math.PI * prog(t, 6.0, 6.5)) : 1})`;
    });
    show($('#qe'), win(t, 7.5, 9.6), 50);
    const mk = $('#qet').querySelectorAll('mark');
    mk.forEach((m, i) => m.style.backgroundSize = `${outC(prog(t, 8.0 + i * .3, 8.6 + i * .3)) * 100}% 100%`);
    const o = outC(prog(t, 9.5, 10.2));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 9.9, 10.5));
  };
}

/* ---------- reel 4: three of a kind, back to back ---------- */
function setupTop3(j) {
  const segs = j.items.map((it, k) => `
    <div class="seg" id="s${k}">
      <div class="n">${k + 1}/3</div>
      <div class="w ltr" id="sw${k}">${esc(it.expr)}</div>
      <div class="m" id="sm${k}">${heb(it.meaning)}</div>
      <div class="e" id="se${k}">${markIn(it.example, it.expr).html}</div>
    </div>`).join('');
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="tag" id="tag"><b>${U.english}</b><span>${esc(j.cat)}</span></div>
    <div class="t3hook" id="h"><b class="ltr">3</b>${j.title}</div>
    ${segs}
    ${outro()}`;
  j.items.forEach((_, k) => {
    const w = $('#sw' + k); let s = 130; w.style.fontSize = s + 'px';
    while (s > 64 && w.getBoundingClientRect().height > s * 1.1 * 2 + 4) { s -= 4; w.style.fontSize = s + 'px'; }
    const m = $('#sm' + k); let f = 66; m.style.fontSize = f + 'px';
    while (f > 40 && m.getBoundingClientRect().height > 250) { f -= 2; m.style.fontSize = f + 'px'; }
    const e = $('#se' + k); let g = 50; e.style.fontSize = g + 'px';
    while (g > 32 && e.getBoundingClientRect().height > 330) { g -= 2; e.style.fontSize = g + 'px'; }
  });
  const T = 16.2, S0 = 2.4, D = 3.9;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#tag'), win(t, 0, 14.1, .5), 20);
    const h = win(t, 0, S0, .4);
    $('#h').style.opacity = h;
    $('#h').style.transform = `scale(${.9 + .1 * outC(prog(t, 0, .6))})`;
    j.items.forEach((_, k) => {
      const a = S0 + k * D, b = a + D, el = $('#s' + k);
      el.style.visibility = t >= a - .05 && t <= b + .05 ? 'visible' : 'hidden';
      /* in from the right, out to the left: reads as "next" */
      const i = outC(prog(t, a, a + .45)), o = inOut(prog(t, b - .35, b));
      el.style.opacity = Math.min(i, 1 - o);
      el.style.transform = `translateX(${(1 - i) * -140 + o * 140}px)`;
      $('#sm' + k).style.opacity = outC(prog(t, a + .5, a + .9));
      $('#se' + k).style.opacity = outC(prog(t, a + 1.1, a + 1.5));
      $('#se' + k).querySelectorAll('mark').forEach(m => m.style.backgroundSize = `${outC(prog(t, a + 1.6, a + 2.1)) * 100}% 100%`);
    });
    const o = outC(prog(t, 14.0, 14.7));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 14.4, 15.0));
  };
}

/* ---------- reel 5: two words people mix up ---------- */
function setupVs(j) {
  const [A, B] = j.pair;
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="tag" id="tag"><b>${U.english}</b><span>${esc(j.cat)}</span></div>
    <div class="vhook" id="h">${U.vsHook}</div>
    <div class="vc a" id="va" style="top:600px"><div class="w" id="vaw">${esc(A.w)}</div><div class="m" id="vam">${heb(A.m)}</div></div>
    <div class="vs" id="vs">vs</div>
    <div class="vc b" id="vb" style="top:990px"><div class="w" id="vbw">${esc(B.w)}</div><div class="m" id="vbm">${heb(B.m)}</div></div>
    <div class="vex" id="ve">${markIn(j.example, j.expr).html}</div>
    ${outro()}`;
  for (const id of ['vaw', 'vbw']) { const w = $('#' + id); let s = 100; while (s > 56 && w.scrollWidth > 760) { s -= 4; w.style.fontSize = s + 'px'; } }
  for (const id of ['vam', 'vbm']) { const m = $('#' + id); let s = 56; while (s > 34 && m.scrollWidth > 760) { s -= 2; m.style.fontSize = s + 'px'; } }
  fit($('#ve'), 46, 30);
  const T = 13.2;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#tag'), win(t, 0, 10.8, .5), 20);
    show($('#h'), win(t, 0, 10.8, .5), 30);
    const a = outC(prog(t, .8, 1.4)), b = outC(prog(t, 1.4, 2.0));
    $('#va').style.opacity = a; $('#va').style.transform = `translateX(${(1 - a) * 200}px)`;
    $('#vb').style.opacity = b; $('#vb').style.transform = `translateX(${(1 - b) * -200}px)`;
    const v = outC(prog(t, 2.0, 2.4));
    $('#vs').style.opacity = v; $('#vs').style.transform = `scale(${.4 + .6 * v}) rotate(${(1 - v) * -30}deg)`;
    /* meanings come in a beat after the words, so the eye reads the pair first */
    $('#vam').style.opacity = outC(prog(t, 2.6, 3.1));
    $('#vbm').style.opacity = outC(prog(t, 3.3, 3.8));
    show($('#ve'), outC(prog(t, 5.4, 6.0)), 50);
    $('#ve').querySelectorAll('mark').forEach((m, i) => m.style.backgroundSize = `${outC(prog(t, 6.4 + i * .5, 7.0 + i * .5)) * 100}% 100%`);
    const fade = 1 - prog(t, 10.4, 10.8);
    for (const id of ['va', 'vb', 'vs', 've']) $('#' + id).style.opacity *= fade;
    const o = outC(prog(t, 10.7, 11.4));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 11.1, 11.7));
  };
}


/* ---------- reel 6: literally / actually. The gap between the two is the
   hook; works for any script, with a transliteration under non-Latin. ---------- */
function setupLit(j) {
  const heScript = /[֐-׿]/.test(j.expr);
  $('#stage').innerHTML = `
    <div class="bar"><i id="bar"></i></div>
    <div class="tag" id="tag"><b>${esc(j.lang)}</b><span>${esc(j.cat || '')}</span></div>
    <div class="hook" id="hook" style="top:360px;font-size:84px">${j.hook}</div>
    <div class="lx" id="lx"><div class="w ${heScript ? 'he' : 'ltr'}" id="w">${esc(j.expr)}</div>${j.tr ? `<div class="tr ltr">${esc(j.tr)}</div>` : ''}</div>
    <div class="lc lit" id="c1"><div class="lb">${U.literally}</div><div class="tx ltr" id="t1"><s>“${esc(j.lit)}”</s></div></div>
    <div class="lc" id="c2"><div class="lb">${U.actually}</div><div class="tx" id="t2">${esc(j.meaning)}</div></div>
    <div class="lc" id="c3"><div class="lb">${U.example}</div><div class="tx" id="t3" dir="${heScript ? 'rtl' : 'ltr'}" style="font-family:${heScript ? 'Frank' : 'Lora'},serif;font-style:${heScript ? 'normal' : 'italic'}">${esc(j.example)}</div><div class="en" dir="ltr">${esc(j.example_en)}</div></div>
    ${outro()}`;
  const w = $('#w'); let s = 130; w.style.fontSize = s + 'px';
  while (s > 64 && w.getBoundingClientRect().height > s * 1.1 * 2 + 4) { s -= 4; w.style.fontSize = s + 'px'; }
  below($('#lx'), $('#hook'), 50);
  for (const id of ['c1', 'c2', 'c3']) below($('#' + id), $('#lx'), 70);
  for (const id of ['t2', 't3']) { const e = $('#' + id); let f = 60; e.style.fontSize = f + 'px'; while (f > 34 && e.getBoundingClientRect().height > 330) { f -= 2; e.style.fontSize = f + 'px'; } }
  const T = 13.4;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    show($('#tag'), win(t, 0, 11, .5), 20);
    show($('#hook'), win(t, .1, 11, .5), 30);
    show($('#lx'), outC(prog(t, .8, 1.4)) * (1 - prog(t, 10.6, 11)), 40);
    show($('#c1'), win(t, 2.0, 4.6), 50);
    /* the literal reading is struck through the moment the real meaning lands */
    const strike = outC(prog(t, 3.6, 4.1));
    $('#t1 s').style.textDecorationLine = strike > 0 ? 'line-through' : 'none';
    $('#t1 s').style.textDecorationColor = `rgba(224,80,60,${strike * .85})`;
    show($('#c2'), win(t, 4.5, 7.6), 50);
    show($('#c3'), win(t, 7.6, 11.0), 50);
    const o = outC(prog(t, 10.9, 11.6));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 11.3, 11.9));
  };
}

/* ---------- reel 7: POV. Meme pacing: one line at a time, then the proof. ---------- */
function setupPov(j) {
  const side = U === UI.en ? 'left' : 'right';
  const lines = '<div class="plist">' + j.lines.map((l, i) => `<div class="pl ${l.cls || ''}" id="p${i}" dir="auto" style="text-align:${side}">${l.t}</div>`).join('') + '</div>';
  const rtl = /[֐-׿]/.test(j.card.expr);
  $('#stage').innerHTML = `
    <div class="pov"></div>
    <div class="bar" style="background:rgba(255,255,255,.2)"><i id="bar" style="background:var(--gold)"></i></div>
    ${lines}
    <div class="pcard" id="pc" style="top:0"><div class="nt ltr">SIDENOTE</div>
      <div class="nx" dir="${rtl ? 'rtl' : 'ltr'}">${esc(j.card.expr)}</div><div class="ng">${esc(j.card.gloss)}</div></div>
    ${outro()}`;
  below($('#pc'), $('.plist'), 70);
  const T = 11;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    j.lines.forEach((_, i) => {
      const a = .2 + i * .75;
      const v = outC(prog(t, a, a + .3));
      const el = $('#p' + i);
      el.style.opacity = v * (1 - prog(t, 8.4, 8.8));
      el.style.transform = `translateY(${(1 - v) * 30}px) scale(${1 + .12 * (1 - v)})`;
    });
    const c = outC(prog(t, .2 + j.lines.length * .75 + .3, .2 + j.lines.length * .75 + .8));
    show($('#pc'), c * (1 - prog(t, 8.4, 8.8)), 80);
    const o = outC(prog(t, 8.6, 9.3));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 9.0, 9.6));
  };
}


/* ---------- reel 8: the real thing. A laptop on a desk; the camera moves
   into the screen, the conversation plays, then it closes in on the
   Sidenote block. The camera is three measured framings, eased between. ---------- */
function setupScreen(j) {
  const rt = /[֐-׿]/.test(j.note.expr);
  const note = `<div class="sn" id="sn"><div class="k">SIDENOTE</div><div class="src" dir="auto">${esc(j.note.src)}</div>
      <div class="x ${rt ? 'rt' : ''}">${esc(j.note.expr)}</div><div class="g" dir="auto">${esc(j.note.gloss)}</div><div class="e">${esc(j.note.ex)}</div></div>`;
  const cli = `<div class="scr cli" id="scr">
      <div class="tb"><i style="background:#FF5F57"></i><i style="background:#FEBC2E"></i><i style="background:#28C840"></i><span class="t">Claude Code — ${esc(j.cwd)}</span></div>
      <div class="col" id="col" dir="${U === UI.en ? 'ltr' : 'rtl'}">
        <div class="wel" dir="ltr"><s>✻</s> <b>Welcome to Claude Code!</b><br>&nbsp;&nbsp;cwd: ${esc(j.cwd)}</div>
        <div class="um" id="um"><span id="umt"></span></div>
        <div class="th" id="th" dir="ltr">✻ Thinking…</div>
        ${j.tools.map((t, i) => `<div class="tl" id="tl${i}"><span class="dot">●</span> ${esc(t[0])}</div><div class="tl r" id="tr${i}">⎿&nbsp; ${esc(t[1])}</div>`).join('')}
        <div class="am" id="am"><span class="dot">●</span><span id="amt"></span></div>
        ${note}
      </div>
      <div class="inp" dir="ltr">&gt; <span id="cur">▌</span></div>
    </div>`;
  const app = `<div class="scr app" id="scr">
      <div class="side" dir="${U === UI.en ? 'ltr' : 'rtl'}"><b>Claude</b>${(j.side || []).map((x, i) => `<div class="${i ? '' : 'on'}">${esc(x)}</div>`).join('')}</div>
      <div class="main"><div class="col" id="col" dir="${U === UI.en ? 'ltr' : 'rtl'}">
        <div class="ub" id="um"><span id="umt"></span></div>
        <div class="th" id="th" dir="ltr" style="color:#D97757">✻</div>
        <div class="ca" id="am"><span class="star">✻</span><span id="amt"></span></div>
        ${note}
      </div>
      <div class="inp" dir="${U === UI.en ? 'ltr' : 'rtl'}">${U === UI.en ? 'Reply to Claude…' : 'השב ל-Claude…'}</div></div>
    </div>`;
  $('#stage').innerHTML = `
    <div class="desk"></div>
    <div class="world" id="world"><div class="lap"><span class="cam"></span>${j.mode === 'app' ? app : cli}</div><div class="base"><i></i></div></div>
    <div class="scrim" id="scrim"></div>
    <div class="capx" id="c1"><span>${j.hook1}</span></div>
    <div class="capx" id="c2"><span>${j.hook2}</span></div>
    <div class="close" id="cl">${j.close}</div>
    <div class="bar" style="z-index:7"><i id="bar"></i></div>
    ${outro()}`;
  $('#out').style.zIndex = 8;
  /* measure in world coordinates while the camera is at rest */
  const world = $('#world'); world.style.transform = 'none';
  /* measure the finished conversation: the answer is typed in later, so an
     empty answer here would put the block too high and hide the overflow */
  $('#umt').textContent = j.prompt; $('#amt').textContent = j.answer; $('#th').style.display = 'none';
  const W = el => { const r = el.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; };
  const lapR = W($('.lap')), colR = W($('#col')), snR0 = W($('#sn')), scrR = W($('#scr'));
  /* Like a real chat, the conversation scrolls up when the block would land
     under the input box. The camera frames where it ends up, not where it began. */
  const overflow = Math.max(0, (snR0.y + snR0.h) - (scrR.y + scrR.h - 120));
  const snR = { ...snR0, y: snR0.y - overflow };
  const CX = 510, CY = 1010;
  const frame = (r, s) => ({ s, x: CX - (r.x + r.w / 2) * s, y: CY - (r.y + r.h / 2) * s });
  const K0 = frame({ x: lapR.x - 120, y: lapR.y, w: lapR.w + 240, h: lapR.h + 46 }, 1000 / (lapR.w + 240));
  const convo = { x: colR.x, y: colR.y, w: colR.w, h: Math.min(colR.h, snR.y - colR.y + snR.h) };
  const K1 = frame(convo, 1.02);
  /* a close-up on the block: as large as it can be without cropping it */
  const K2 = frame(snR, Math.min(1.45, 1000 / snR.w));
  const mix = (a, b, k) => ({ s: a.s + (b.s - a.s) * k, x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
  const T = 16;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    let c = K0;
    if (t < 5.9) c = mix(K0, K1, inOut(prog(t, .9, 2.1)));
    else if (t < 10.6) c = mix(K1, K2, inOut(prog(t, 5.9, 6.9)));
    else c = mix(K2, K0, inOut(prog(t, 10.6, 11.6)));
    world.style.transform = `translate(${c.x}px, ${c.y}px) scale(${c.s})`;
    show($('#c1'), win(t, .1, 5.6, .4), 20);
    show($('#c2'), win(t, 6.0, 10.5, .4), 20);
    /* the conversation: typed fast, the time goes to the block */
    const qp = prog(t, 1.4, 2.2);
    $('#umt').textContent = j.prompt.slice(0, Math.round(j.prompt.length * qp));
    $('#um').style.visibility = qp > 0 ? 'visible' : 'hidden';
    const spin = '✢✳✶✻✽'[Math.floor(t * 8) % 5];
    $('#th').textContent = j.mode === 'app' ? spin : `${spin} ${U === UI.en ? 'Thinking…' : 'Thinking…'}`;
    $('#th').style.display = t > 2.3 && t < 3.0 ? 'block' : 'none';
    (j.tools || []).forEach((_, i) => {
      $('#tl' + i).style.visibility = t > 2.9 + i * .5 ? 'visible' : 'hidden';
      $('#tr' + i).style.visibility = t > 3.1 + i * .5 ? 'visible' : 'hidden';
    });
    const a0 = j.mode === 'app' ? 3.0 : 2.9 + (j.tools || []).length * .5 + .2;
    const ap = prog(t, a0, a0 + 1.3);
    $('#amt').textContent = j.answer.slice(0, Math.round(j.answer.length * ap));
    $('#am').style.visibility = ap > 0 ? 'visible' : 'hidden';
    $('#col').style.transform = `translateY(${-overflow * inOut(prog(t, 5.0, 5.6))}px)`;
    const n = outC(prog(t, 5.3, 5.8));
    $('#sn').style.opacity = n; $('#sn').style.transform = `translateY(${(1 - n) * 24}px)`;
    if ($('#cur')) $('#cur').style.opacity = Math.floor(t * 2) % 2 ? 0 : 1;
    const sc = prog(t, 10.7, 11.3) * (1 - prog(t, 13.2, 13.6));
    $('#scrim').style.opacity = sc;
    const cl = outC(prog(t, 11.0, 11.6)) * (1 - prog(t, 13.2, 13.6));
    $('#cl').style.opacity = cl; $('#cl').style.transform = `translateY(${(1 - cl) * 30}px)`;
    const o = outC(prog(t, 13.4, 14.1));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, 13.8, 14.4));
  };
}


/* ---------- reel 9: over stock footage. A list of timed items (meme text,
   time labels, chat bubbles, a list, the Sidenote card) on a transparent
   frame; make.py lays the frames over the clips. ---------- */
function setupBroll(j) {
  /* the page itself must be see-through, or the footage never shows */
  document.body.classList.add('clear');
  document.documentElement.style.background = 'transparent';
  const parts = [];
  let chat = '', list = '';
  j.items.forEach((it, i) => {
    const id = 'i' + i, d = `dir="auto"`;
    if (it.kind === 'meme') parts.push(`<div class="meme" id="${id}" ${d} style="top:${it.top || 330}px">${it.text}</div>`);
    else if (it.kind === 'label') parts.push(`<div class="lbl" id="${id}"><span>${it.text}</span></div>`);
    else if (it.kind === 'them' || it.kind === 'me' || it.kind === 'claude') chat += `<div class="bub ${it.kind}" id="${id}" ${d}>${it.text}</div>`;
    else if (it.kind === 'li') list += `<div class="li" id="${id}"><b>${esc(it.expr)}</b><span ${d}>${esc(it.gloss)}</span></div>`;
    else if (it.kind === 'card') parts.push(`<div class="bcard" id="${id}" style="top:${it.top || 1120}px"><div class="k">SIDENOTE</div>
        <div class="x">${esc(it.expr)}</div><div class="g" ${d}>${esc(it.gloss)}</div><div class="e">${esc(it.ex)}</div></div>`);
  });
  $('#stage').innerHTML = `<div class="shade"></div>
    ${chat ? `<div class="chat" style="top:${j.chatTop || 330}px">${chat}</div>` : ''}${list ? `<div class="lst">${list}</div>` : ''}
    ${parts.join('')}
    <div class="bar"><i id="bar"></i></div>
    ${outro()}`;
  const T = j.dur;
  return t => {
    $('#bar').style.transform = `scaleX(${clamp(t / T)})`;
    j.items.forEach((it, i) => {
      const el = $('#i' + i);
      const v = win(t, it.t0, it.t1, .3);
      el.style.opacity = v;
      const pop = it.kind === 'me' || it.kind === 'them' || it.kind === 'claude' || it.kind === 'li';
      el.style.transform = pop ? `translateY(${(1 - v) * 24}px) scale(${.92 + .08 * v})` : `translateY(${(1 - v) * 30}px)`;
    });
    $('.shade').style.opacity = 1 - prog(t, j.outro - .2, j.outro + .4);
    const o = outC(prog(t, j.outro, j.outro + .7));
    $('#out').style.transform = `translateY(${(1 - o) * 1920}px)`;
    $('#out .in').style.opacity = outC(prog(t, j.outro + .4, j.outro + 1.0));
  };
}

window.setup = async function (job) {
  await document.fonts.ready;
  U = UI[job.ui] || UI.he;
  document.documentElement.lang = job.ui || 'he';
  document.documentElement.dir = job.ui === 'en' ? 'ltr' : 'rtl';
  const SETUP = { demo: [setupDemo, 13], quiz: [setupQuiz, 12.4], top3: [setupTop3, 16.2], vs: [setupVs, 13.2],
                  lit: [setupLit, 13.4], pov: [setupPov, 11], screen: [setupScreen, 16],
                  broll: [setupBroll, job.dur] };
  const [fn, dur] = SETUP[job.type] || [setupExpr, 15];
  /* Built twice on purpose: the first build makes the browser fetch the
     fonts its text needs, and only the second measures real line breaks.
     Measuring in the fallback font let wrapped headings overlap. */
  R = fn(job);
  await document.fonts.ready;
  await new Promise(r => setTimeout(r, 50));
  R = fn(job);
  await document.fonts.ready;
  return dur;
};
window.render = function (t) { R(t); };
</script>
